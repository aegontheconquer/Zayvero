<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZAYVERO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;overflow-x:hidden}

/* NAV */
nav{
position:fixed;
width:100%;
padding:25px 80px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
z-index:1000;
}
nav ul{display:flex;gap:40px;list-style:none}
nav a{text-decoration:none;color:white;font-size:12px;letter-spacing:3px}
.cart-icon{cursor:pointer}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1520975928318-3b7f70d3a7e7?auto=format&fit=crop&w=1600&q=80') center/cover;
text-align:center;
}
.hero h1{font-family:'Playfair Display',serif;font-size:90px;letter-spacing:10px}

/* SECTION */
.section{padding:140px 10%}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:60px;
}
.product{text-align:center}
.product img{width:100%;height:420px;object-fit:cover;border-radius:16px}
.product h3{margin-top:20px}
.product p{margin:10px 0;color:#aaa}
.product button{
padding:10px 30px;
border:1px solid white;
background:transparent;
color:white;
cursor:pointer;
}

/* CART PANEL */
#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
opacity:0;
visibility:hidden;
transition:0.4s;
z-index:2000;
}
#overlay.active{
opacity:1;
visibility:visible;
}
.cart-panel{
position:fixed;
top:0;
right:-400px;
width:350px;
height:100vh;
background:#111;
padding:40px;
transition:0.5s;
z-index:3000;
overflow-y:auto;
}
.cart-panel.active{right:0}

.cart-item{
margin-bottom:15px;
display:flex;
justify-content:space-between;
font-size:14px;
}
.cart-total{
margin-top:20px;
font-size:18px;
}
.checkout-btn{
margin-top:20px;
padding:10px 20px;
border:1px solid white;
background:transparent;
color:white;
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:5000;
}
.modal.active{
opacity:1;
visibility:visible;
}
.modal-content{
background:#111;
padding:40px;
border-radius:20px;
width:90%;
max-width:500px;
text-align:center;
}
.modal-content input{
width:100%;
padding:10px;
margin:10px 0;
background:#000;
border:1px solid #333;
color:white;
}
</style>
</head>
<body>

<nav>
<h1>ZAYVERO</h1>
<ul>
<li><a href="#home">HOME</a></li>
<li><a href="#shop">SHOP</a></li>
</ul>
<div class="cart-icon" onclick="toggleCart()">🛒 <span id="cart-count">0</span></div>
</nav>

<div id="overlay" onclick="toggleCart()"></div>

<div class="cart-panel" id="cartPanel">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="cart-total">Total: $<span id="cartTotal">0</span></div>
<button class="checkout-btn" onclick="openCheckout()">Checkout</button>
</div>

<div class="hero" id="home">
<h1>ZAYVERO</h1>
</div>

<div class="section" id="shop">
<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=900&q=80">
<h3>Shadow Bomber</h3>
<p>$110</p>
<button onclick="addToCart('Shadow Bomber',110)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80">
<h3>Essential White Tee</h3>
<p>$45</p>
<button onclick="addToCart('Essential White Tee',45)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1516826957135-700dedea698c?auto=format&fit=crop&w=900&q=80">
<h3>Urban Grey Hoodie</h3>
<p>$85</p>
<button onclick="addToCart('Urban Grey Hoodie',85)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=900&q=80">
<h3>Elite Black Suit</h3>
<p>$240</p>
<button onclick="addToCart('Elite Black Suit',240)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1503342452485-86d0b4c6c1d2?auto=format&fit=crop&w=900&q=80">
<h3>Classic Denim Jacket</h3>
<p>$95</p>
<button onclick="addToCart('Classic Denim Jacket',95)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=900&q=80">
<h3>Luxury Knit Sweater</h3>
<p>$120</p>
<button onclick="addToCart('Luxury Knit Sweater',120)">Add to Cart</button>
</div>

</div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
<div class="modal-content">
<h2>Checkout</h2>
<form onsubmit="completeCheckout(event)">
<input placeholder="Full Name" required>
<input placeholder="Email" required>
<input placeholder="Address" required>
<button type="submit" class="checkout-btn">Place Order</button>
</form>
</div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("zayveroCart")) || [];

function saveCart(){
localStorage.setItem("zayveroCart", JSON.stringify(cart));
updateCartUI();
}

function updateCartUI(){
const cartItems = document.getElementById("cartItems");
const cartCount = document.getElementById("cart-count");
const cartTotal = document.getElementById("cartTotal");

cartItems.innerHTML = "";
let total = 0;

cart.forEach((item,index)=>{
total += item.price;
cartItems.innerHTML += `
<div class="cart-item">
<span>${item.name}</span>
<span>$${item.price}</span>
</div>`;
});

cartCount.textContent = cart.length;
cartTotal.textContent = total;
}

function addToCart(name,price){
cart.push({name,price});
saveCart();
}

function toggleCart(){
document.getElementById("overlay").classList.toggle("active");
document.getElementById("cartPanel").classList.toggle("active");
}

function openCheckout(){
document.getElementById("checkoutModal").classList.add("active");
}

function completeCheckout(e){
e.preventDefault();
alert("Order placed successfully!");
cart = [];
saveCart();
document.getElementById("checkoutModal").classList.remove("active");
toggleCart();
}

updateCartUI();
</script>

</body>
</html>
