<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZAYVERO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 60px;
      letter-spacing: 5px;
      margin: 0;
    }

    h2 {
      font-size: 20px;
      font-weight: 300;
      margin-top: 20px;
      letter-spacing: 3px;
    }

    .btn {
      margin-top: 40px;
      padding: 15px 40px;
      border: 1px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>ZAYVERO</h1>
    <h2>Power. Elevation. Presence.</h2>
    <button class="btn">SHOP COLLECTION</button>
  </div>

</body>
</html>
